name: Build Windows Exe

on:
  push:
    branches: [ "apate_windows" ] # Listen to your apate_windows branch

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    # 1. Check out the code (including submodules, but skip LFS to ignore .mp4 and .png files)
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: false
        submodules: recursive

    # 2. Set up MSYS2 environment (provides make, gcc, and dependency libraries)
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          make
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-libpng
          mingw-w64-x86_64-libtiff
          mingw-w64-x86_64-libjpeg-turbo

    # 3. Compile JM Decoder
    - name: Compile JM Decoder
      shell: msys2 {0}
      run: |
        cd jm
        # Use external injection to force ignoring type mismatch errors
        # -Wno-error=incompatible-pointer-types: Downgrade this error to a warning
        # -fpermissive: Allow non-standard C code
        # -w: Suppress all warnings (to keep the logs clean and avoid interference from other indentation warnings)
        # LIBS: Add ws2_32 (Windows Socket), png, tiff, jpeg libraries
        make clean
        make -j4 ldecod \
          CFLAGS="-g -O2 -fcommon -Wno-error=incompatible-pointer-types -fpermissive -w" \
          LIBS="-lm -lws2_32 -lpng -ltiff -ljpeg"

        mkdir -p ../dist_bin
        # Adjust the path based on the actual output location in your Makefile
        # If the bin directory does not exist, try cp ldecod.exe ../dist_bin/
        if [ -f bin/ldecod.exe ]; then
          cp bin/ldecod.exe ../dist_bin/
        else
          cp ldecod.exe ../dist_bin/
        fi

        # Copy required DLLs from MSYS2 to dist_bin for runtime dependencies
        # These DLLs are needed when ldecod.exe runs outside MSYS2 environment
        # Dynamically detect runtime dependencies using ldd
        echo "Detecting runtime dependencies for ldecod.exe..."
        
        # Get the actual ldecod.exe path
        if [ -f bin/ldecod.exe ]; then
          LDECOD_PATH="bin/ldecod.exe"
        else
          LDECOD_PATH="ldecod.exe"
        fi
        
        # Extract DLL dependencies from ldd output
        # Filter for DLLs in MINGW_PREFIX/bin directory
        ldd "$LDECOD_PATH" | grep "${MINGW_PREFIX}/bin" | awk '{print $3}' | while read dll_path; do
          if [ -f "$dll_path" ]; then
            dll_name=$(basename "$dll_path")
            cp "$dll_path" ../dist_bin/
            echo "Copied $dll_name"
          fi
        done
        
        # Also copy some core runtime DLLs that may not be detected by ldd
        # but are required for standalone execution
        CORE_DLLS=(
          libwinpthread-1.dll
          libgcc_s_seh-1.dll
          libstdc++-6.dll
        )
        
        for dll in "${CORE_DLLS[@]}"; do
          dll_path="${MINGW_PREFIX}/bin/$dll"
          if [ -f "$dll_path" ]; then
            # Check if not already copied
            if [ ! -f "../dist_bin/$dll" ]; then
              cp "$dll_path" ../dist_bin/
              echo "Copied $dll (core runtime)"
            fi
          else
            echo "Warning: Core DLL $dll not found at $dll_path"
          fi
        done

    # 4. Download Windows version of FFmpeg
    - name: Download FFmpeg
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
        Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp
        Get-ChildItem -Path "ffmpeg_temp" -Filter "ffmpeg.exe" -Recurse | Copy-Item -Destination "dist_bin/ffmpeg.exe"
        Get-ChildItem -Path "ffmpeg_temp" -Filter "ffprobe.exe" -Recurse | Copy-Item -Destination "dist_bin/ffprobe.exe"

    # 5. Set up Python and package executables
    - name: Install dependencies and Build Exe
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

        # Package the first executable: Command-line version
        # -n specifies the output file name as video_analysis_cmd.exe
        pyinstaller --onefile --add-data "dist_bin/*;dist_bin/" --collect-all imagecodecs --clean -n "video_analysis_cmd" perform_video_analysis.py

        # Package the second executable: GUI version
        # --noconsole ensures no black command-line window pops up during execution
        # -n specifies the output file name as video_analysis_gui.exe
        # pyinstaller --onefile --noconsole --add-data "dist_bin/*;dist_bin/" --collect-all imagecodecs --clean -n "video_analysis_gui" perform_video_analysis_gui.py
        pyinstaller --onefile --add-data "dist_bin/*;dist_bin/" --collect-all imagecodecs --clean -n "video_analysis_gui" perform_video_analysis_gui.py

    # 6. Upload the results
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GOP-Detection-Windows-All
        path: dist/*.exe
